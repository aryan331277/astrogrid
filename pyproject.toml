[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrogrid"
version = "1.0.0"
description = "AstroGrid: Unified Multi-Messenger Observational Astrophysics Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pytest>=7.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "httpx>=0.24.0"
]
